<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>جَذْر — معاجم العربية</title>
<meta name="theme-color" content="#EAE2CE" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --waraq:#EAE2CE; --waraq2:#F7F2E4; --waraq3:#E1D8C0;
    --midad:#1C1A15; --khafeef:#6A6355;
    --zunjufr:#A1222C; --zumurrud:#0F544C; --dhahab:#B08A32;
  }
  html,body{margin:0;background:var(--waraq)}
  body{
    color:var(--midad); min-height:100vh;
    padding-bottom:calc(3rem + env(safe-area-inset-bottom));
    background:radial-gradient(120% 90% at 85% -10%, #F5EFE0 0%, rgba(245,239,224,0) 60%), var(--waraq);
    font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .naskh{font-family:"Amiri","Noto Naskh Arabic",serif}
  header{
    display:flex; align-items:baseline; gap:.7rem; flex-wrap:wrap;
    padding:calc(1rem + env(safe-area-inset-top)) 1.2rem .85rem;
    border-bottom:1px solid var(--waraq3); box-shadow:0 1px 0 rgba(176,138,50,.35);
    position:sticky; top:0; z-index:5; background:rgba(234,226,206,.94); backdrop-filter:blur(6px);
  }
  .logo{font-family:"Amiri",serif; font-size:1.6rem; color:var(--zunjufr); line-height:1}
  .sub{font-size:.72rem; color:var(--khafeef)}
  main{max-width:820px; margin:0 auto; padding:0 1rem}
  .search{display:flex; gap:.5rem; margin-top:1.4rem}
  input{
    flex:1; min-width:0; font-family:"Amiri",serif; font-size:1.45rem; padding:.5rem .8rem;
    background:var(--waraq2); border:1px solid var(--waraq3); border-bottom:2px solid var(--midad);
    border-radius:3px 3px 0 0; color:var(--midad);
  }
  input::placeholder{color:#A79E88}
  input:focus{outline:2px solid var(--zumurrud); outline-offset:2px}
  button.go{
    font-family:inherit; font-size:.9rem; font-weight:600; padding:.5rem 1.1rem; cursor:pointer;
    background:var(--zumurrud); color:#F7F2E4; border:none; border-radius:3px; white-space:nowrap;
  }
  button.go:active{background:#0B403A}
  .chips{display:flex; flex-wrap:wrap; gap:.35rem}
  .word{
    font-family:"Amiri",serif; font-size:1.3rem; cursor:pointer; background:none; border:none;
    color:var(--zumurrud); padding:.1rem .3rem; border-bottom:1px dotted var(--dhahab);
  }
  .hint{margin-top:2rem; border-top:1px solid var(--waraq3); padding-top:1.2rem}
  .hint p{font-size:.85rem; color:var(--khafeef); line-height:1.75; margin:0 0 .7rem}
  .head{margin-top:1.8rem}
  .rule{height:1px; background:var(--dhahab); opacity:.5}
  .headin{padding:1rem 0; text-align:center}
  h1{font-family:"Amiri",serif; color:var(--zunjufr); font-size:clamp(2.2rem,10vw,3.4rem);
     letter-spacing:.2em; margin:0; line-height:1.1}
  .sect{font-size:.72rem; letter-spacing:.14em; color:var(--khafeef);
        margin:2rem 0 .8rem; display:flex; align-items:center; gap:.6rem}
  .sect::after{content:""; flex:1; height:1px; background:var(--waraq3)}
  .card{display:grid; grid-template-columns:2.6rem 1fr; background:var(--waraq2);
        border:1px solid var(--waraq3); border-radius:3px; margin-bottom:.7rem; overflow:hidden}
  .gutter{display:flex; justify-content:center; padding-top:.9rem; background:#F1EADA;
          border-inline-end:1px solid var(--waraq3); font-family:"Amiri",serif;
          font-size:1.05rem; color:var(--zumurrud)}
  .body{padding:.8rem .95rem .9rem; min-width:0}
  .src{display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap}
  .src b{font-size:.9rem}
  .tag{font-size:.65rem; padding:.1rem .4rem; border-radius:2px; color:var(--zumurrud);
       border:1px solid rgba(15,84,76,.4); background:rgba(15,84,76,.06)}
  .nass{font-family:"Amiri",serif; font-size:1.15rem; line-height:1.95; margin:.4rem 0 0;
        white-space:pre-wrap; overflow-wrap:break-word}
  .nass.clip{max-height:15rem; overflow:hidden; -webkit-mask-image:linear-gradient(#000 72%,transparent);
             mask-image:linear-gradient(#000 72%,transparent)}
  .more{font-family:inherit; font-size:.76rem; background:none; border:none; cursor:pointer;
        color:var(--zumurrud); padding:.4rem 0 0; text-decoration:underline}
  .out{font-size:.74rem; color:var(--zumurrud); text-decoration:none; border-bottom:1px solid var(--dhahab)}
  .none{font-size:.82rem; color:var(--khafeef); margin:.4rem 0 0}
  .aya{border-inline-start:2px solid var(--dhahab); padding-inline-start:.8rem; margin-bottom:.85rem}
  .aya p{font-family:"Amiri",serif; font-size:1.2rem; line-height:2; margin:0}
  .aya cite{font-style:normal; font-size:.72rem; color:var(--khafeef)}
  .khaz{display:grid; gap:.4rem}
  .khaz a{display:flex; justify-content:space-between; gap:.6rem; flex-wrap:wrap; align-items:baseline;
          padding:.6rem .8rem; background:var(--waraq2); border:1px solid var(--waraq3);
          border-radius:3px; text-decoration:none; color:var(--midad); font-size:.88rem}
  .khaz span{font-size:.72rem; color:var(--khafeef)}
  .load{margin-top:2rem; text-align:center; font-family:"Amiri",serif; font-size:1.3rem; color:var(--khafeef)}
  .note{margin-top:1.5rem; padding:.7rem .85rem; border:1px dashed var(--waraq3); border-radius:3px;
        font-size:.75rem; line-height:1.8; color:var(--khafeef)}
  .hist{margin-top:2rem; padding-top:1rem; border-top:1px solid var(--waraq3)}
  /* ——— توقيع صاحب التطبيق ——— */
  .sign{margin-top:2.6rem; padding-top:1.3rem; border-top:1px solid var(--dhahab);
        display:flex; align-items:center; gap:.85rem; justify-content:center; text-align:start}
  .sign img, .sign .fallback{
    width:56px; height:56px; border-radius:50%; object-fit:cover; flex:none;
    border:1px solid var(--dhahab); background:var(--waraq2);
  }
  .sign .fallback{display:flex; align-items:center; justify-content:center;
    font-family:"Amiri",serif; font-size:1.5rem; color:var(--zunjufr)}
  .sign b{display:block; font-family:"Amiri",serif; font-size:1.3rem; font-weight:400}
  .sign span{font-size:.73rem; color:var(--khafeef)}
  .sign a{color:var(--zumurrud); text-decoration:none; border-bottom:1px solid var(--dhahab)}
  @media (max-width:480px){ input{font-size:1.2rem} .card{grid-template-columns:2.2rem 1fr} }
</style>
</head>
<body>
<header>
  <span class="logo">جَذْر</span>
  <span class="sub">معاجم العربية — منقول من مصادره</span>
</header>

<main>
  <div class="search">
    <input id="q" placeholder="اكتب كلمة أو جذرًا…" spellcheck="false" aria-label="الكلمة المطلوبة" />
    <button class="go" id="go">ابحث</button>
  </div>

  <div id="out"></div>

  <section class="hint" id="hint">
    <p>اكتب كلمة، فيجلب لك التطبيق مدخلها من ويكاموس العربي نصًّا كما هو، وشواهدها من القرآن
       بالآيات، ثم يدلّك على خزائن المعاجم لقراءة النصّ الكامل. أو ابدأ بإحدى هذه:</p>
    <div class="chips" id="amthila"></div>
  </section>

  <section class="hist" id="histbox" hidden>
    <h2 class="sect">بحثتَ قبل قليل</h2>
    <div class="chips" id="hist"></div>
  </section>

  <!-- ▼▼ توقيعك: غيّر الاسم والوصف في السطور الثلاثة الأولى من السكربت أسفل الملف ▼▼ -->
  <footer class="sign" id="sign"></footer>
</main>

const AMTHILA = ["كَتَبَ","سَراب","هَمّ","رَحيم","فَتَنَ","نَوى"];
const KHAZAIN = [
  ["معجم الدوحة التاريخي","أقدم استعمال موثَّق للفظ", w => "https://www.dohadictionary.org/ar"],
  ["الباحث العربي","لسان العرب والقاموس والصحاح", w => "http://www.baheth.info/all.jsp?term="+encodeURIComponent(w)],
  ["المعاني","معاجم عربية ومترجمة", w => "https://www.almaany.com/ar/dict/ar-ar/"+encodeURIComponent(w)+"/"],
  ["مكتبة الحَورَماني المعجمية","نصوص المعاجم كاملة ومعجم لين", w => "https://arabiclexicon.hawramani.com/?s="+encodeURIComponent(w)],
];
const bare = w => w.replace(/[\u064B-\u0652\u0670\u0640]/g,"").trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let hist = [];
try { hist = JSON.parse(localStorage.getItem("jathr:hist") || "[]"); } catch(e){}

async function wiktionary(word){
  const url = "https://ar.wiktionary.org/w/api.php?action=query&format=json&origin=*"
            + "&prop=extracts&explaintext=1&redirects=1&titles=" + encodeURIComponent(bare(word));
  const r = await fetch(url);
  if(!r.ok) throw 0;
  const j = await r.json();
  const p = Object.values(j?.query?.pages || {})[0];
  if(!p || p.missing !== undefined || !p.extract) return null;
  return { text: p.extract.replace(/\n{3,}/g,"\n\n").trim(),
           link: "https://ar.wiktionary.org/wiki/" + encodeURIComponent(p.title) };
}

async function quran(word){
  const t = bare(word);
  try{
    const r = await fetch("https://api.alquran.cloud/v1/search/"+encodeURIComponent(t)+"/all/quran-simple");
    if(r.ok){
      const j = await r.json();
      const m = j?.data?.matches || [];
      if(m.length) return m.slice(0,3).map(x => ({
        nass: x.text, masdar: (x.surah?.name||"") + " " + x.surah?.number + ":" + x.numberInSurah }));
    }
  }catch(e){}
  const r2 = await fetch("https://api.quran.com/api/v4/search?q="+encodeURIComponent(t)+"&size=3&language=ar");
  if(!r2.ok) throw 0;
  const j2 = await r2.json();
  return (j2?.search?.results || []).slice(0,3).map(x => ({
    nass: (x.text||"").replace(/<[^>]+>/g,""), masdar: "الآية " + x.verse_key }));
}

function drawHist(){
  const box = document.getElementById("histbox");
  const el = document.getElementById("hist");
  box.hidden = hist.length === 0;
  el.innerHTML = hist.map(w => '<button class="word">'+esc(w)+'</button>').join("");
  [...el.children].forEach(b => b.onclick = () => run(b.textContent));
}

async function run(word){
  const term = (word ?? document.getElementById("q").value).trim();
  if(!term) return;
  document.getElementById("q").value = term;
  document.getElementById("q").blur();
  document.getElementById("hint").hidden = true;
  const out = document.getElementById("out");
  out.innerHTML = '<div class="load naskh">يُقَلِّب الصفحات…</div>';

  const [w, q] = await Promise.allSettled([wiktionary(term), quran(term)]);

  let html = '<section class="head"><div class="rule"></div><div class="headin">'
           + '<h1>' + esc(bare(term)) + '</h1></div><div class="rule"></div></section>';

  html += '<h2 class="sect">منقول من المصدر</h2>';

  html += '<article class="card"><div class="gutter">وك</div><div class="body">'
        + '<div class="src"><b>ويكاموس العربي</b><span class="tag">نصّ المصدر</span></div>';
  if(w.status === "fulfilled" && w.value){
    html += '<p class="nass clip" id="wik">'+esc(w.value.text)+'</p>'
          + '<button class="more" id="morebtn">اعرض المدخل كاملًا</button>'
          + '<div style="margin-top:.5rem"><a class="out" target="_blank" rel="noreferrer" href="'
          + w.value.link + '">افتح الصفحة في ويكاموس ↗</a></div>';
  } else if(w.status === "fulfilled"){
    html += '<p class="none">لا مدخل لهذه الكلمة في ويكاموس العربي.</p>';
  } else {
    html += '<p class="none">تعذّر الوصول إلى ويكاموس — تحقّق من الاتصال.</p>';
  }
  html += '</div></article>';

  html += '<article class="card"><div class="gutter">قر</div><div class="body">'
        + '<div class="src"><b>شواهد من القرآن الكريم</b><span class="tag">نصّ المصدر</span></div>';
  if(q.status === "fulfilled" && q.value && q.value.length){
    html += '<div style="margin-top:.6rem">' + q.value.map(a =>
      '<div class="aya"><p>'+esc(a.nass)+'</p><cite>'+esc(a.masdar)+'</cite></div>').join("") + '</div>';
  } else if(q.status === "fulfilled"){
    html += '<p class="none">لم يقع هذا اللفظ بهذه الصيغة في القرآن.</p>';
  } else {
    html += '<p class="none">تعذّر الوصول إلى خدمة البحث القرآني.</p>';
  }
  html += '</div></article>';

  html += '<h2 class="sect">اقرأ النصّ الكامل في مصدره</h2><div class="khaz">'
        + KHAZAIN.map(([n,note,u]) => '<a target="_blank" rel="noreferrer" href="'+u(bare(term))+'">'
          + '<b>'+n+' ↗</b><span>'+note+'</span></a>').join("") + '</div>'
        + '<div class="note">كل ما تراه هنا منقول من مصدره مباشرة، وما عليه من عهدة أصحابه. '
        + 'معجم الدوحة والباحث العربي لا يتيحان واجهة برمجية عامة، فوصلناك بصفحاتهما.</div>';

  out.innerHTML = html;

  const mb = document.getElementById("morebtn");
  if(mb) mb.onclick = () => {
    const p = document.getElementById("wik");
    p.classList.toggle("clip");
    mb.textContent = p.classList.contains("clip") ? "اعرض المدخل كاملًا" : "اطوِ المدخل";
  };

  hist = [term, ...hist.filter(x => x !== term)].slice(0,12);
  try { localStorage.setItem("jathr:hist", JSON.stringify(hist)); } catch(e){}
  drawHist();
}

// ——— التوقيع: تظهر الصورة إن وُجدت، وإلا فحرف الاسم الأول داخل دائرة ———
(function(){
  const el = document.getElementById("sign");
  const ism = esc(ISMI);
  const nass = '<div><b>' + (RABIT ? '<a href="'+RABIT+'" target="_blank" rel="noreferrer">'+ism+'</a>' : ism)
             + '</b><span>' + esc(WASFI) + '</span></div>';
  el.innerHTML = '<img src="' + SURATI + '" alt="' + ism + '" id="sura" />' + nass;
  const img = document.getElementById("sura");
  img.onerror = () => {
    const d = document.createElement("div");
    d.className = "fallback";
    d.textContent = ISMI.trim().charAt(0) || "ج";
    img.replaceWith(d);
  };
})();

document.getElementById("amthila").innerHTML =
  AMTHILA.map(w => '<button class="word">'+w+'</button>').join("");
[...document.getElementById("amthila").children].forEach(b => b.onclick = () => run(b.textContent));
document.getElementById("go").onclick = () => run();
document.getElementById("q").addEventListener("keydown", e => { if(e.key === "Enter") run(); });
drawHist();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
